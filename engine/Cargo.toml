[package]
name = "irufus_engine"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Storage, image parsing and writing engine for iRufus"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bzip2 = "0.6.1"
crc32fast = "1.5.2"
fatfs = { path = "vendor/fatfs", default-features = false, features = ["std", "alloc"] }
flate2 = "1.1.10"
libc = "0.2"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
xz2 = { version = "0.1.7", features = ["static"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate", "bzip2", "zstd"] }
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1

debug = 1
